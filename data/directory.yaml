systems:
  - { id: wiki,             name: Internal Wiki,              owner: admin_jo,      sensitivity: low,
      description: "internal documentation and runbooks", role_defaults: { "Software Engineer": read, "Support Engineer": read, "Data Analyst": read } }
  - { id: ci-pipeline,      name: CI/CD Pipeline,             owner: priya_devops,  sensitivity: medium,
      description: "build and deployment pipeline", role_defaults: { "Software Engineer": read, "Site Reliability Engineer": write } }
  - { id: dev-sandbox,      name: Dev Sandbox Cluster,        owner: priya_devops,  sensitivity: low,
      description: "non-production development cluster", role_defaults: { "Software Engineer": write, "DevOps Engineer": admin } }
  - { id: staging-api,      name: Staging Shop API,           owner: marco_eng_mgr, sensitivity: medium,
      description: "pre-production copy of the shop API", role_defaults: { "Software Engineer": write } }
  - { id: analytics-warehouse, name: Analytics Warehouse,     owner: nadia_eng_mgr, sensitivity: medium,
      description: "de-identified product analytics tables", role_defaults: { "Data Analyst": read, "Data Engineer": write } }
  - { id: error-tracker,    name: Error Tracker,              owner: nadia_eng_mgr, sensitivity: medium,
      description: "application error and trace dashboard", role_defaults: { "Software Engineer": read, "Site Reliability Engineer": read, "Support Engineer": read } }
  - { id: feature-flags,    name: Feature Flag Service,       owner: marco_eng_mgr, sensitivity: medium,
      description: "runtime feature toggles", role_defaults: { "Software Engineer": read } }
  - { id: prod-orders-db,   name: Production Orders Database,  owner: nadia_eng_mgr, sensitivity: high,
      description: "live customer orders, contains personal data", role_defaults: { "Site Reliability Engineer": read } }
  - { id: prod-web,         name: Production Web Servers,      owner: priya_devops,  sensitivity: high,
      description: "the live shop web tier", role_defaults: { "Site Reliability Engineer": write } }
  - { id: payments-gateway, name: Payments Gateway,           owner: cto_vik,       sensitivity: critical,
      description: "processes live card payments", role_defaults: {} }
  - { id: payroll,          name: Payroll System,             owner: beth_ops_mgr,  sensitivity: critical,
      description: "employee salaries and bank details", role_defaults: {} }
  - { id: crm,              name: Customer CRM,               owner: rhea_rev_mgr,  sensitivity: high,
      description: "customer accounts and contact details", role_defaults: { "Account Executive": read, "Sales Development Rep": read } }
  - { id: billing-admin,    name: Billing Admin Console,      owner: rhea_rev_mgr,  sensitivity: critical,
      description: "issue refunds and change billing", role_defaults: {} }
  - { id: iam-console,      name: Identity & Access Console,   owner: admin_jo,      sensitivity: critical,
      description: "manage user accounts and permissions", role_defaults: { "IT Administrator": admin } }
  - { id: marketing-cms,    name: Marketing CMS,              owner: rhea_rev_mgr,  sensitivity: low,
      description: "public website content", role_defaults: { "Marketing Specialist": write } }

# Standing access some people already hold, beyond their role defaults.
current_access:
  dana_sre: { prod-web: write, prod-orders-db: read }
  owen_sre: { prod-web: write }
  iris_support: { crm: read }
  admin_jo: { iam-console: admin, payroll: read }
