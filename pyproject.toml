[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "access-desk"
version = "1.0.0"
description = "Triage employee access requests with Jev typed questions: auto-approve the safe, time-boxed ones, escalate the rest, and never over-grant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samiul Huda" }]
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.10", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
accessdesk = "accessdesk.cli:main"

[tool.setuptools]
packages = ["accessdesk", "accessdesk.backends"]

[tool.setuptools.package-data]
accessdesk = ["static/*.html"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"data/make_dataset.py" = ["E501"]
"eval/*.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["accessdesk", "eval"]

[[tool.mypy.overrides]]
module = ["uvicorn"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
